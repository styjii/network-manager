# Production : Nginx sert le frontend compilé (frontend/dist) et relaie /api vers Django (gunicorn/runserver sur 8100).
# Même origine pour le navigateur : cookie de session + jeton CSRF, sans CORS.
server {
    listen 8090;
    server_name _;

    root /srv/network-manager/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers générés (nom + empreinte) : cache long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Application monopage : toute autre adresse renvoie index.html (React Router).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
